<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Vérificateur du projet - Diag incendie by Kevin</title>
<style>
  body{font-family:'Segoe UI',sans-serif;background:#f5f5f5;padding:2rem;max-width:800px;margin:auto}
  h1{color:#d32f2f}
  button{padding:1rem 2rem;background:#d32f2f;color:#fff;border:none;border-radius:8px;font-size:1.1rem;cursor:pointer}
  table{width:100%;border-collapse:collapse;background:#fff;margin-top:1rem;box-shadow:0 2px 6px rgba(0,0,0,.1)}
  td{padding:.6rem 1rem;border-bottom:1px solid #eee;font-size:.9rem}
  .ok{color:#2e7d32;font-weight:700}.ko{color:#c62828;font-weight:700}
  #verdict{margin-top:1rem;padding:1rem;border-radius:8px;font-size:1.2rem;font-weight:700;color:#fff}
</style>
</head>
<body>
<h1>🔎 Vérificateur automatique du projet</h1>
<p>Sélectionnez le dossier racine <code>diag-incendie-by-kevin</code> : chaque fichier requis est contrôlé (présence + contenu).</p>
<button id="pick">📂 Sélectionner le dossier du projet</button>
<div id="verdict"></div>
<div id="results"></div>

<script>
const REQUIRED = [
  'index.html', 'manifest.json', 'service-worker.js',
  'css/styles.css',
  'js/app.js', 'js/database.js', 'js/gemini-search.js',
  'images/icon.svg', 'images/apple-touch-icon.png',
  'images/icon-44x44.png','images/icon-72x72.png','images/icon-96x96.png','images/icon-120x120.png',
  'images/icon-128x128.png','images/icon-144x144.png','images/icon-150x150.png','images/icon-152x152.png',
  'images/icon-167x167.png','images/icon-180x180.png','images/icon-192x192.png','images/icon-310x310.png',
  'images/icon-384x384.png','images/icon-512x512.png','images/icon-1024x1024.png',
  'tools/generate-icons.html', 'tools/verifier.html'
];

document.getElementById('pick').addEventListener('click', async () => {
    if (!window.showDirectoryPicker) { alert('Utilisez Chrome ou Edge sur ordinateur.'); return; }
    const dir = await window.showDirectoryPicker();
    const files = new Map();

    async function walk(handle, prefix) {
        for await (const entry of handle.values()) {
            const path = prefix ? prefix + '/' + entry.name : entry.name;
            if (entry.kind === 'file') files.set(path, entry);
            else await walk(entry, path);
        }
    }
    await walk(dir, '');

    let html = '<table>', okCount = 0;
    for (const req of REQUIRED) {
        const present = files.has(req);
        let extra = '';
        if (present && req === 'js/gemini-search.js') {
            const txt = await (await files.get(req).getFile()).text();
            if (txt.includes('VOTRE_CLE_API_GEMINI')) extra = ' — ⚠️ clé Gemini à remplacer !';
        }
        if (present && req === 'manifest.json') {
            const txt = await (await files.get(req).getFile()).text();
            if (!txt.includes('Diag incendie by Kevin')) extra = ' — ⚠️ nom d\'app manquant !';
        }
        if (present) okCount++;
        html += `<tr><td class="${present ? 'ok' : 'ko'}">${present ? '✅' : '❌'}</td><td>${req}${extra}</td></tr>`;
    }
    html += '</table>';
    document.getElementById('results').innerHTML = html;

    const v = document.getElementById('verdict');
    if (okCount === REQUIRED.length) {
        v.style.background = '#2e7d32';
        v.textContent = `✅ PROJET COMPLET : ${okCount}/${REQUIRED.length} fichiers vérifiés. Prêt pour GitHub + PWABuilder !`;
    } else {
        v.style.background = '#c62828';
        v.textContent = `⚠️ ${okCount}/${REQUIRED.length} fichiers présents. Complétez les ❌ puis revérifiez.`;
    }
});
</script>
</body>
</html>
